<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="New Year — fireworks over skyline">
  <defs>
    <linearGradient id="nye-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a5a"/>
      <stop offset="60%" stop-color="#3E5A9E"/>
      <stop offset="100%" stop-color="#0a1230"/>
    </linearGradient>
    <linearGradient id="nye-skyline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="burst-gold" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fff2b3"/>
      <stop offset="100%" stop-color="#c9a349" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burst-pink" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffb3d1"/>
      <stop offset="100%" stop-color="#c94a75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burst-teal" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#a3f0e0"/>
      <stop offset="100%" stop-color="#3aa39a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#nye-bg)"/>

  <!-- Skyline silhouette -->
  <g fill="url(#nye-skyline)">
    <path d="M0 420 L60 420 L60 360 L100 360 L100 300 L140 300 L140 420 Z"/>
    <path d="M140 420 L200 420 L200 260 L240 260 L240 220 L260 220 L260 260 L300 260 L300 420 Z"/>
    <path d="M300 420 L360 420 L360 340 L380 340 L380 300 L420 300 L420 340 L440 340 L440 420 Z"/>
    <path d="M440 420 L500 420 L500 260 L540 260 L540 220 L560 220 L560 260 L600 260 L600 420 Z"/>
    <path d="M600 420 L660 420 L660 320 L700 320 L700 380 L740 380 L740 420 L800 420 L800 500 L0 500 Z"/>
  </g>

  <!-- Firework bursts -->
  <g transform="translate(200 160)">
    <circle r="90" fill="url(#burst-gold)"/>
    <g stroke="#fff2b3" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-70" x2="0" y2="-30"/>
      <line x1="0" y1="30"  x2="0" y2="70"/>
      <line x1="-70" y1="0" x2="-30" y2="0"/>
      <line x1="30" y1="0"  x2="70" y2="0"/>
      <line x1="-50" y1="-50" x2="-24" y2="-24"/>
      <line x1="50" y1="50"   x2="24" y2="24"/>
      <line x1="-50" y1="50"  x2="-24" y2="24"/>
      <line x1="50" y1="-50"  x2="24" y2="-24"/>
    </g>
    <circle r="6" fill="#fff2b3"/>
  </g>

  <g transform="translate(560 130)">
    <circle r="80" fill="url(#burst-pink)"/>
    <g stroke="#ffb3d1" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-60" x2="0" y2="-28"/>
      <line x1="0" y1="28"  x2="0" y2="60"/>
      <line x1="-60" y1="0" x2="-28" y2="0"/>
      <line x1="28" y1="0"  x2="60" y2="0"/>
      <line x1="-42" y1="-42" x2="-20" y2="-20"/>
      <line x1="42" y1="42"   x2="20" y2="20"/>
      <line x1="-42" y1="42"  x2="-20" y2="20"/>
      <line x1="42" y1="-42"  x2="20" y2="-20"/>
    </g>
    <circle r="5" fill="#ffb3d1"/>
  </g>

  <g transform="translate(400 90)">
    <circle r="70" fill="url(#burst-teal)"/>
    <g stroke="#a3f0e0" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-24"/>
      <line x1="0" y1="24"  x2="0" y2="52"/>
      <line x1="-52" y1="0" x2="-24" y2="0"/>
      <line x1="24" y1="0"  x2="52" y2="0"/>
      <line x1="-36" y1="-36" x2="-18" y2="-18"/>
      <line x1="36" y1="36"   x2="18" y2="18"/>
      <line x1="-36" y1="36"  x2="-18" y2="18"/>
      <line x1="36" y1="-36"  x2="18" y2="-18"/>
    </g>
    <circle r="4" fill="#a3f0e0"/>
  </g>

  <!-- Stars -->
  <g fill="#fff2b3" opacity="0.7">
    <circle cx="100" cy="60"  r="2"/>
    <circle cx="700" cy="50"  r="2"/>
    <circle cx="120" cy="220" r="2"/>
    <circle cx="680" cy="240" r="2"/>
    <circle cx="60"  cy="130" r="2"/>
    <circle cx="740" cy="150" r="2"/>
  </g>

  <!-- "Happy New Year" ribbon marker -->
  <text x="400" y="470" text-anchor="middle" fill="#fff2b3" font-family="Georgia, serif" font-weight="700" font-size="24" opacity="0.9">✨ HAPPY NEW YEAR ✨</text>
</svg>
