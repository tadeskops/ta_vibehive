<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Navratri — dandiya and garba">
  <defs>
    <radialGradient id="nav-bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#4a1f2b"/>
      <stop offset="100%" stop-color="#1a0812"/>
    </radialGradient>
    <linearGradient id="stick1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2c94c"/>
      <stop offset="100%" stop-color="#7a4b0a"/>
    </linearGradient>
    <linearGradient id="stick2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#5a2f0a"/>
    </linearGradient>
    <radialGradient id="halo-red" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffb3d1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c1272d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#nav-bg)"/>

  <!-- Center goddess halo -->
  <circle cx="400" cy="220" r="200" fill="url(#halo-red)"/>
  <circle cx="400" cy="220" r="80" fill="#f2c94c" opacity="0.35"/>

  <!-- Trishul silhouette -->
  <g transform="translate(400 200)" fill="#f2c94c" opacity="0.9">
    <rect x="-3" y="-40" width="6" height="120"/>
    <path d="M-20 -50 L0 -80 L20 -50 L14 -46 L0 -66 L-14 -46 Z"/>
    <path d="M-30 -20 L-20 -50 L-10 -20 L-16 -18 L-20 -34 L-24 -18 Z"/>
    <path d="M30 -20 L20 -50 L10 -20 L16 -18 L20 -34 L24 -18 Z"/>
  </g>

  <!-- Dandiya sticks crossed -->
  <g transform="translate(400 340) rotate(-25)">
    <rect x="-140" y="-8" width="280" height="16" rx="8" fill="url(#stick1)"/>
    <rect x="-140" y="-8" width="20"  height="16" rx="4" fill="#c1272d"/>
    <rect x="120"  y="-8" width="20"  height="16" rx="4" fill="#c1272d"/>
  </g>
  <g transform="translate(400 340) rotate(25)">
    <rect x="-140" y="-8" width="280" height="16" rx="8" fill="url(#stick2)"/>
    <rect x="-140" y="-8" width="20"  height="16" rx="4" fill="#3f5c34"/>
    <rect x="120"  y="-8" width="20"  height="16" rx="4" fill="#3f5c34"/>
  </g>

  <!-- Fairy lights arc -->
  <path d="M40 100 Q400 20 760 100" fill="none" stroke="#7a4b0a" stroke-width="1" opacity="0.5"/>
  <g>
    <circle cx="80"  cy="98"  r="6" fill="#ffb020"/>
    <circle cx="160" cy="70"  r="6" fill="#c1272d"/>
    <circle cx="240" cy="48"  r="6" fill="#3E5A9E"/>
    <circle cx="320" cy="34"  r="6" fill="#3f5c34"/>
    <circle cx="400" cy="30"  r="6" fill="#c94a75"/>
    <circle cx="480" cy="34"  r="6" fill="#3f5c34"/>
    <circle cx="560" cy="48"  r="6" fill="#3E5A9E"/>
    <circle cx="640" cy="70"  r="6" fill="#c1272d"/>
    <circle cx="720" cy="98"  r="6" fill="#ffb020"/>
  </g>

  <!-- Sparkles -->
  <g fill="#fff2b3" opacity="0.9">
    <circle cx="120" cy="240" r="2"/>
    <circle cx="700" cy="240" r="2"/>
    <circle cx="140" cy="380" r="2"/>
    <circle cx="680" cy="380" r="2"/>
    <circle cx="240" cy="420" r="2"/>
    <circle cx="560" cy="420" r="2"/>
  </g>
</svg>
