name: Live Contribution Reports Export

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if current hour is outside configured windows'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: reports-cron
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate live reports snapshot
        env:
          TVH_ARCHIVE_PAT: ${{ secrets.TVH_ARCHIVE_PAT }}
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          node scripts/generate-reports.mjs

      # Branch protection on main now requires 3 status checks, so a bot
      # `git push` is rejected with GH013. Persist snapshots as artifacts
      # + step summary instead (same fix pattern as feature-audit-save.yml,
      # commit 29b6719). Nothing in the app consumes docs/ops/live-reports/.
      - name: Publish latest snapshot to step summary
        if: hashFiles('docs/ops/live-reports/latest.md') != ''
        run: |
          cat docs/ops/live-reports/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot artifact
        if: hashFiles('docs/ops/live-reports/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: live-reports-${{ github.run_number }}
          path: docs/ops/live-reports/
          retention-days: 90
