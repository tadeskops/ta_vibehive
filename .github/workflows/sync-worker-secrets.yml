# Syncs Worker secrets (PAT, Google client id) from GitHub Actions secrets
# to the deployed Cloudflare Worker.
#
# Run once after the Worker is first deployed, and again anytime you
# rotate the PAT — no local wrangler commands required.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - scoped to Workers Edit permission
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id
#   TVH_ARCHIVE_PAT        - fine-grained GitHub PAT (Contents R/W on the archive repo)
#
# How to run:
#   Actions -> "sync-worker-secrets" -> Run workflow

name: sync-worker-secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Push TVH_ARCHIVE_PAT to Cloudflare
        run: printf '%s' "$TVH_ARCHIVE_PAT" | npx wrangler secret put TVH_ARCHIVE_PAT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TVH_ARCHIVE_PAT: ${{ secrets.TVH_ARCHIVE_PAT }}
