name: Feature Audit Snapshot

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-audit-save
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate feature audit
        run: |
          node scripts/feature-audit.mjs

      - name: Publish snapshot to step summary
        run: |
          cat temp/feature-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-audit-${{ github.run_number }}
          path: temp/feature-audit.md
          retention-days: 90
