# Watches every workflow on this repo. When any workflow completes on
# main (or dev) with `conclusion == failure`, opens (or updates) a
# GitHub issue tagged `ci-red` so the failure cannot sit undetected.
# The issue auto-closes on the next green run of the same workflow.
#
# Complements the uptime workflow: uptime catches "prod is down",
# this catches "the deploy that would have fixed prod also failed".

name: ci-alert

on:
  workflow_run:
    workflows:
      - 'CI · verify + feature audit'
      - 'deploy-worker'
      - 'Deploy to GitHub Pages'
      - 'Live Contribution Reports Export'
      - 'sync-worker-secrets'
      - 'Feature Audit Snapshot'
      - 'uptime'
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ci-alert-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  notify:
    if: ${{ github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const failed = run.conclusion === 'failure' || run.conclusion === 'timed_out';
            const title  = 'CI red: ' + run.name + ' on ' + run.head_branch;
            const label  = 'ci-red';

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 30,
            });
            const existing = open.find(i => i.title === title);

            if (failed) {
              const body = [
                '**Workflow:** ' + run.name,
                '**Branch:** ' + run.head_branch,
                '**Commit:** ' + run.head_sha,
                '**Run:** ' + run.html_url,
                '**Started:** ' + run.run_started_at,
                '',
                'Auto-opened by `.github/workflows/ci-alert.yml`. This issue auto-closes on the next successful run of the same workflow.',
              ].join('\n');
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number,
                  body: 'Another failure: ' + run.html_url + ' (' + run.head_sha.slice(0, 7) + ')',
                });
                console.log('Appended failure to #' + existing.number);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title, body, labels: [label],
                });
                console.log('Opened #' + created.data.number);
              }
            } else if (existing && run.conclusion === 'success') {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: 'Recovered: ' + run.html_url + ' (' + run.head_sha.slice(0, 7) + ') - auto-closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed',
              });
              console.log('Closed recovered issue #' + existing.number);
            }
