name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble artifact
        # Static SPA — no build step. Copy only shipped surfaces.
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp 404.html _site/
          cp manifest.webmanifest _site/
          cp -R assets _site/
          cp -R config _site/
          if [ -f robots.txt ]; then cp robots.txt _site/; fi
          echo "Deployed at $(date -u +%FT%TZ)" > _site/BUILD.txt
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
