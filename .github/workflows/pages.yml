name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble artifact
        # Static SPA — no build step. Copy only shipped surfaces.
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp 404.html _site/
          cp manifest.webmanifest _site/
          cp -R assets _site/
          cp -R config _site/
          if [ -f robots.txt ]; then cp robots.txt _site/; fi
          echo "Deployed at $(date -u +%FT%TZ)" > _site/BUILD.txt
          ls -la _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test deployed site
        env:
          BASE: https://tadeskops.github.io/ta_vibehive
        run: |
          set -euo pipefail
          sleep 8
          fail=0
          check() {
            local path=$1 want=$2 label=$3
            local got
            got=$(curl -sS -o /tmp/body.$$ -w '%{http_code}' -m 15 "$BASE$path" || echo 000)
            if [ "$got" != "$want" ]; then
              echo "::error::SMOKE FAIL $label $path expected=$want got=$got"
              fail=1
            else
              echo "OK $label $path -> $got"
            fi
            rm -f /tmp/body.$$
          }
          check /                             200 'index'
          check /BUILD.txt                    200 'build stamp'
          check /assets/js/app.js             200 'entry script'
          check /config/features.json         200 'features registry'
          check /manifest.webmanifest         200 'PWA manifest'
          exit $fail
