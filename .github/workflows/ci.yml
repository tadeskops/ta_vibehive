name: CI · verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: G1..G4 gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for HTML checks)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: G4 · gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: G4 · CSP presence check
        run: |
          set -euo pipefail
          missing=0
          for f in index.html 404.html; do
            if ! grep -q 'Content-Security-Policy' "$f"; then
              echo "::error file=$f::missing Content-Security-Policy meta"
              missing=1
            fi
            if ! grep -q 'X-Content-Type-Options' "$f"; then
              echo "::error file=$f::missing X-Content-Type-Options meta"
              missing=1
            fi
          done
          exit $missing

      - name: G4 · no inline JS / event handlers
        run: |
          set -euo pipefail
          # Fail if any HTML has an inline event handler or <script> without src.
          if grep -RInE 'on(click|load|error|submit|change|input|mouseover|focus|blur)=' --include='*.html' .; then
            echo "::error::inline event handlers detected"
            exit 1
          fi
          if grep -RInE '<script[^>]*>[^<]' --include='*.html' .; then
            echo "::error::inline <script> body detected — use external src only"
            exit 1
          fi

      - name: G4 · no LLM in request path (marker grep)
        run: |
          set -euo pipefail
          # Reject anthropic/openai SDK usage in shipped code (allow in docs/temp/scripts).
          if grep -RInE '(openai|anthropic|langchain|@ai-sdk)' assets index.html 404.html 2>/dev/null; then
            echo "::error::LLM SDK found in shipped assets"
            exit 1
          fi

      - name: G3 · LOC + size budget
        shell: bash
        run: |
          set -euo pipefail
          # LOC across shipped source (assets + top-level HTML). Vendored libs excluded.
          loc=$(find assets -type f \( -name '*.css' -o -name '*.js' \) \
                            -not -path 'assets/vendor/*' -print0 2>/dev/null \
              | xargs -0 cat 2>/dev/null | wc -l || echo 0)
          htmloc=$(cat index.html 404.html 2>/dev/null | wc -l)
          total=$((loc + htmloc))
          echo "LOC: assets=$loc html=$htmloc total=$total"
          if [ "$total" -gt 2500 ]; then
            echo "::error::phase G-0 LOC budget exceeded ($total > 2500)"
            exit 1
          fi
          # First-paint payload (index.html + base.css + vendored Alpine), gzipped.
          # Budget 150 KB gzipped from G0-02 onward.
          gz=$(cat index.html assets/css/base.css assets/vendor/alpine-*.min.js 2>/dev/null | gzip -c9 | wc -c)
          echo "First-paint gz=${gz}B"
          if [ "$gz" -gt 153600 ]; then
            echo "::error::first-paint > 150 KB gzipped"
            exit 1
          fi
          # CSS-only budget: 10 KB gzipped.
          csgz=$(cat assets/css/base.css | gzip -c9 | wc -c)
          echo "CSS gz=${csgz}B"
          if [ "$csgz" -gt 10240 ]; then
            echo "::error::CSS > 10 KB gzipped"
            exit 1
          fi

      - name: G1 · unit tests (Node built-in runner)
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            node --test tests/
          else
            echo "no tests/ dir yet — skipping"
          fi

      - name: G4 · SRI attribute present on vendored scripts
        run: |
          set -euo pipefail
          # Any vendored script referenced by HTML must carry an integrity= attribute.
          missing=0
          for f in index.html 404.html; do
            for ref in $(grep -oE 'assets/vendor/[a-zA-Z0-9._-]+\.js' "$f" || true); do
              if ! grep -q "$ref" "$f"; then continue; fi
              if ! grep -B1 -A2 "$ref" "$f" | grep -q 'integrity="sha384-'; then
                echo "::error file=$f::vendored ref $ref lacks integrity=sha384-... attribute"
                missing=1
              fi
            done
          done
          exit $missing

      - name: G1 · HTML validate (basic well-formed)
        run: |
          set -euo pipefail
          npx --yes html-validate@8 index.html 404.html || {
            echo "::warning::html-validate found issues (non-blocking for G0-02)"
          }
