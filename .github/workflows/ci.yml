name: CI · verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: G1..G4 gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node (for HTML checks)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: G4 · gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: G4 · CSP presence + strictness
        run: |
          set -euo pipefail
          missing=0
          for f in index.html 404.html; do
            for header in 'Content-Security-Policy' 'X-Content-Type-Options' 'Referrer-Policy' 'Permissions-Policy'; do
              if ! grep -q "$header" "$f"; then
                echo "::error file=$f::missing $header meta"
                missing=1
              fi
            done
            # Strict CSP: no unsafe-inline / unsafe-eval; must have default-src 'self' + frame-ancestors 'none'
            if grep -q "unsafe-inline\|unsafe-eval" "$f"; then
              echo "::error file=$f::CSP contains unsafe-inline or unsafe-eval"; missing=1
            fi
            if ! grep -q "default-src 'self'" "$f"; then
              echo "::error file=$f::CSP missing default-src 'self'"; missing=1
            fi
            if ! grep -q "frame-ancestors 'none'" "$f"; then
              echo "::error file=$f::CSP missing frame-ancestors 'none'"; missing=1
            fi
          done
          exit $missing

      - name: G4 · no dangerous DOM sinks
        run: |
          set -euo pipefail
          # innerHTML=, outerHTML=, document.write, x-html, eval(, new Function(
          patterns='innerHTML\s*=|outerHTML\s*=|document\.write|x-html\s*=|\beval\s*\(|new\s+Function\s*\('
          if grep -RInE "$patterns" assets/ lib/ index.html 404.html 2>/dev/null | grep -v 'assets/vendor/'; then
            echo "::error::forbidden DOM sink"
            exit 1
          fi

      - name: G4 · no inline JS / event handlers
        run: |
          set -euo pipefail
          # Allow Alpine x-on: bindings; strip before checking.
          for f in index.html 404.html; do
            stripped=$(sed -E 's/x-on:[a-z]+=/BLANK=/g; s/@[a-z]+=/BLANK=/g' "$f")
            if echo "$stripped" | grep -qE 'on(click|load|error|submit|change|input|mouseover|focus|blur|keydown|keyup)\s*='; then
              echo "::error file=$f::inline event handler"
              exit 1
            fi
          done
          if grep -RInE '<script[^>]*>[^<]' --include='*.html' .; then
            echo "::error::inline <script> body detected"
            exit 1
          fi

      - name: G4 · no LLM in request path (marker grep)
        run: |
          set -euo pipefail
          if grep -RInE '(openai|anthropic|langchain|@ai-sdk)' assets lib index.html 404.html 2>/dev/null; then
            echo "::error::LLM SDK found in shipped/lib code"
            exit 1
          fi

      - name: G3 · LOC + size budget
        shell: bash
        run: |
          set -euo pipefail
          # LOC across shipped source (assets + top-level HTML + lib workflow-side).
          # Vendored libs excluded (hash-pinned third-party).
          loc=$(find assets lib -type f \( -name '*.css' -o -name '*.js' \) \
                                -not -path 'assets/vendor/*' -print0 2>/dev/null \
              | xargs -0 cat 2>/dev/null | wc -l || echo 0)
          htmloc=$(cat index.html 404.html 2>/dev/null | wc -l)
          total=$((loc + htmloc))
          echo "LOC: code+lib=$loc html=$htmloc total=$total"
          if [ "$total" -gt 2500 ]; then
            echo "::error::phase G-0 LOC budget exceeded ($total > 2500)"
            exit 1
          fi
          # First-paint payload (index.html + base.css + vendored Alpine), gzipped.
          # Budget 150 KB gzipped from G0-02 onward.
          gz=$(cat index.html assets/css/base.css assets/vendor/alpine-*.min.js 2>/dev/null | gzip -c9 | wc -c)
          echo "First-paint gz=${gz}B"
          if [ "$gz" -gt 153600 ]; then
            echo "::error::first-paint > 150 KB gzipped"
            exit 1
          fi
          # CSS-only budget: 10 KB gzipped.
          csgz=$(cat assets/css/base.css | gzip -c9 | wc -c)
          echo "CSS gz=${csgz}B"
          if [ "$csgz" -gt 10240 ]; then
            echo "::error::CSS > 10 KB gzipped"
            exit 1
          fi

      - name: G1 · unit tests (Node built-in runner)
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            node --test tests/
          else
            echo "no tests/ dir yet — skipping"
          fi

      - name: G4 · SRI attribute present on vendored scripts
        run: |
          set -euo pipefail
          # Any vendored script referenced by HTML must carry an integrity= attribute.
          missing=0
          for f in index.html 404.html; do
            for ref in $(grep -oE 'assets/vendor/[a-zA-Z0-9._-]+\.js' "$f" || true); do
              if ! grep -q "$ref" "$f"; then continue; fi
              if ! grep -B1 -A2 "$ref" "$f" | grep -q 'integrity="sha384-'; then
                echo "::error file=$f::vendored ref $ref lacks integrity=sha384-... attribute"
                missing=1
              fi
            done
          done
          exit $missing

      - name: G1 · HTML validate (basic well-formed)
        run: |
          set -euo pipefail
          npx --yes html-validate@8 index.html 404.html || {
            echo "::warning::html-validate found issues (non-blocking for G0-02)"
          }
