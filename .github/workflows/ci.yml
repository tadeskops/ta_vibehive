name: CI · verify + feature audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Integrity and feature checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: G4 · gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Core verify checks
        run: |
          node scripts/ci-verify.mjs

      - name: Feature coverage audit
        run: |
          node scripts/feature-audit.mjs

      - name: Publish feature summary
        run: |
          cat temp/feature-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload feature audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-audit
          path: temp/feature-audit.md

  worker-typecheck:
    # Gate every push and PR on `npx tsc --noEmit` for the worker so a
    # typechecking regression cannot silently block deploy-worker.yml
    # (which only runs on push to main touching worker/**).
    name: Worker typecheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install worker deps
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Typecheck
        run: npx tsc --noEmit

  client-parse:
    # Catches the "silent white-screen from a JS syntax error" class of
    # bugs: every assets/js/**/*.js file is parse-checked with node
    # --check as an ES module, and every config/*.json is JSON.parse'd.
    # Belt-and-braces against the boundary-slice class of edits that
    # can leave a function header dangling.
    name: Client JS + JSON parse
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse-check every assets/js JS file as ESM
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            tmp="$(mktemp --suffix=.mjs)"
            cp "$f" "$tmp"
            if ! node --check "$tmp" 2>>/tmp/parse.err; then
              echo "::error file=$f::syntax error - see log below"
              fail=1
            fi
            rm -f "$tmp"
          done < <(find assets/js -type f -name '*.js' -print0)
          echo "Parse-checked $count files"
          if [ -s /tmp/parse.err ]; then
            echo '--- parse errors ---'
            cat /tmp/parse.err
          fi
          exit $fail
      - name: Validate every config/*.json
        run: |
          set -euo pipefail
          fail=0
          for f in config/*.json; do
            if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/tmp/json.err; then
              echo "::error file=$f::invalid JSON"
              cat /tmp/json.err
              fail=1
            fi
          done
          exit $fail
