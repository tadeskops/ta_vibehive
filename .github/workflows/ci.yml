name: CI · verify + feature audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Integrity and feature checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: G4 · gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Core verify checks
        run: |
          node scripts/ci-verify.mjs

      - name: Feature coverage audit
        run: |
          node scripts/feature-audit.mjs

      - name: Publish feature summary
        run: |
          cat temp/feature-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload feature audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: feature-audit
          path: temp/feature-audit.md
