<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf3ea">
  <meta name="description" content="Contribute to Ganesh Chaturthi 2026 · Trinity Arcade">
  <meta name="robots" content="index,follow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">
  <title>Contribute &middot; Ganesh Chaturthi 2026</title>
  <link rel="icon" href="/assets/images/TaLogo.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/base.css">
  <script defer type="module" src="/assets/js/contribute-init.js"></script>
  <script defer src="/assets/vendor/alpine-3.14.1.min.js"
          integrity="sha384-l8f0VcPi/M1iHPv8egOnY/15TDwqgbOR1anMIJWvU6nLRgZVLTLSaNqi/TOoT5Fh"
          crossorigin="anonymous"></script>
</head>
<body x-data="contributePage" x-init="init">

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar" role="banner">
    <a class="brand-mark" href="/" aria-label="ta_vibehive home">
      <span class="brand-tile brand-tile--sm" aria-hidden="true">
        <img src="/assets/images/TaLogo.png" alt="" width="40" height="40">
      </span>
      <span class="brand-wordmark">
        <span class="brand-name-sm">ta<span class="brand-name-dot">&middot;</span>vibehive</span>
        <span class="brand-society">The Address</span>
      </span>
    </a>
    <a class="lang-btn is-active" href="/g/ganpati-2026/">&larr; Event</a>
  </header>

  <main id="main" class="shell" role="main">

    <p class="event-state" x-show="loading" x-cloak aria-live="polite">Loading&hellip;</p>

    <section class="event-state event-state--err" x-show="!loading && error" x-cloak aria-live="assertive">
      <h1>Could not load event</h1>
      <p x-text="error"></p>
      <p><a class="err-cta" href="/">Back to home</a></p>
    </section>

    <template x-if="!loading && !error">
      <div>
        <h1 class="contrib-title">Contribute</h1>
        <p class="contrib-sub">Ganesh Chaturthi 2026 &middot; every rupee is committee-verified.</p>

        <form class="contrib-form" x-on:submit.prevent="submit()" autocomplete="off">

          <fieldset class="contrib-fs">
            <legend class="contrib-fs__legend">Choose an amount</legend>
            <div class="contrib-tiers" role="radiogroup" aria-label="Amount tiers">
              <template x-for="t in tiers" :key="t">
                <label class="contrib-tier">
                  <input type="radio" name="tier" :value="t" x-model.number="selectedTier">
                  <span class="contrib-tier__amount" x-text="'₹' + t.toLocaleString('en-IN')"></span>
                </label>
              </template>
              <label class="contrib-tier contrib-tier--custom">
                <input type="radio" name="tier" value="custom" x-model="selectedTier">
                <span class="contrib-tier__amount">Custom</span>
              </label>
            </div>
            <div class="contrib-custom" x-show="selectedTier === 'custom'" x-cloak>
              <label for="amt" class="contrib-label">Custom amount (₹)</label>
              <input id="amt" type="number" inputmode="numeric" min="101" max="500000" step="1"
                     class="contrib-input" x-model="customAmount" placeholder="e.g. 1001">
              <p class="contrib-hint">Whole rupees between ₹101 and ₹5,00,000.</p>
            </div>
          </fieldset>

          <fieldset class="contrib-fs">
            <legend class="contrib-fs__legend">Your details</legend>
            <label class="contrib-label" for="flat">Flat number</label>
            <input id="flat" type="text" class="contrib-input" required
                   maxlength="8" placeholder="A-101 or 1401"
                   pattern="^([A-Za-z]-)?\d{1,4}$"
                   x-model="flat">

            <label class="contrib-label" for="name" x-show="!anonymous" x-cloak>Your name</label>
            <input id="name" type="text" class="contrib-input" x-show="!anonymous" x-cloak
                   maxlength="80" placeholder="As you'd like it acknowledged"
                   x-model="name">

            <label class="contrib-check">
              <input type="checkbox" x-model="anonymous">
              <span>Contribute anonymously (name won't appear on the public dashboard)</span>
            </label>
          </fieldset>

          <p class="contrib-error" x-show="submitError" x-cloak x-text="submitError" role="alert"></p>

          <div class="contrib-actions">
            <a class="btn-ghost" href="/g/ganpati-2026/">Cancel</a>
            <button type="submit" class="btn" :disabled="submitting || submitted">
              <span x-show="!submitted">Continue to payment</span>
              <span x-show="submitted" x-cloak>Redirecting&hellip;</span>
            </button>
          </div>

          <p class="contrib-foot">
            You'll pay via UPI on the next screen. No card details are collected here.
            The final amount is <strong x-text="'₹' + effectiveAmount.toLocaleString('en-IN')"></strong>.
          </p>
        </form>
      </div>
    </template>

    <footer class="foot">
      <p>Slice G1-02 &middot; Phase G-1 Contribution &middot; <a href="/">Home</a></p>
    </footer>
  </main>

</body>
</html>
