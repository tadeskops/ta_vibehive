<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf3ea">
  <meta name="description" content="Ganesh Chaturthi 2026 · Trinity Arcade community celebration · contribute + follow live progress.">
  <meta name="robots" content="index,follow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()">
  <title>Ganesh Chaturthi 2026 &middot; ta_vibehive</title>
  <link rel="icon" href="/assets/images/TaLogo.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/base.css">
  <script defer type="module" src="/assets/js/event-init.js"></script>
  <script defer src="/assets/vendor/alpine-3.14.1.min.js"
          integrity="sha384-l8f0VcPi/M1iHPv8egOnY/15TDwqgbOR1anMIJWvU6nLRgZVLTLSaNqi/TOoT5Fh"
          crossorigin="anonymous"></script>
</head>
<body x-data="eventPage" x-init="init">

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar" role="banner">
    <a class="brand-mark" href="/" aria-label="ta_vibehive home">
      <span class="brand-tile brand-tile--sm" aria-hidden="true">
        <img src="/assets/images/TaLogo.png" alt="" width="40" height="40">
      </span>
      <span class="brand-wordmark">
        <span class="brand-name-sm">ta<span class="brand-name-dot">&middot;</span>vibehive</span>
        <span class="brand-society">The Address</span>
      </span>
    </a>
  </header>

  <main id="main" class="shell" role="main">

    <!-- Loading state (Alpine hides after init) -->
    <p class="event-state" x-show="loading" x-cloak aria-live="polite">Loading event&hellip;</p>

    <!-- Error state -->
    <section class="event-state event-state--err" x-show="!loading && error" x-cloak aria-live="assertive">
      <h1>Could not load event</h1>
      <p x-text="error"></p>
      <p><a class="err-cta" href="/">Back to home</a></p>
    </section>

    <!-- Event content -->
    <template x-if="!loading && !error && event">
      <div>
        <section class="event-hero hero-card" :class="clusterCls" aria-labelledby="ev-title">
          <div class="hero-card__glow" aria-hidden="true"></div>
          <div class="hero-card__body">
            <span class="pill pill--terra" x-text="event.subtitle || 'Community event'"></span>
            <h1 id="ev-title" class="hero-card__title" x-text="event.title"></h1>
            <p class="hero-card__sub" x-text="event.purpose"></p>
            <p class="hero-card__meta">
              <span x-text="startDate"></span> &mdash; <span x-text="endDate"></span>
            </p>
          </div>
        </section>

        <section class="event-goal" aria-labelledby="goal-title">
          <h2 id="goal-title" class="event-goal__title">Community goal</h2>
          <p class="event-goal__amount" x-text="inr"></p>
          <p class="event-goal__hint">Contribution page opens once we go live. Every rupee is committee-verified before it appears here.</p>
        </section>

        <section class="event-tiers" aria-labelledby="tiers-title">
          <h2 id="tiers-title" class="event-tiers__title">Suggested tiers</h2>
          <ul class="event-tiers__list" role="list">
            <template x-for="t in event.tiers_inr" :key="t">
              <li class="event-tiers__item" x-text="tierLabel(t)"></li>
            </template>
            <li class="event-tiers__item event-tiers__item--custom">Or any amount you choose</li>
          </ul>
        </section>

        <p class="event-foot">
          Contact <span x-text="event.contact && event.contact.committee"></span>.
          Contributions close <span x-text="event.closes_at ? event.closes_at.slice(0, 10) : ''"></span>.
        </p>
      </div>
    </template>

    <footer class="foot">
      <p>
        The Address Co-operative Housing Society Ltd. &middot; Baner, Pune
        &middot; Reg PNA/PNA(2)/HSG/(TC)/29730/2025&#8209;2026
      </p>
      <p>
        Slice G1-01 &middot; Phase G-1 Contribution &middot;
        <a href="/">Home</a>
      </p>
    </footer>
  </main>

</body>
</html>
