# ta_vibehive · gitleaks config
# Uses the default rules and adds allowlists for repo-safe strings.

title = "ta_vibehive"

[extend]
useDefault = true

[allowlist]
description = "Repo-safe strings that gitleaks may otherwise flag."
paths = [
  '''(^|/)temp/''',
  '''(^|/)docs/threats/''',
  '''(^|/)LICENSE$''',
  '''(^|/)README\.md$''',
]
regexes = [
  # Society registration number — not a secret, appears on public letterhead.
  '''PNA/PNA\(2\)/HSG/\(TC\)/29730/2025-2026''',
]
